[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skd-backtest"
version = "0.1.0"
description = "Daily index-enhancement backtest framework with asynchronous data playback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=14"]

[project.optional-dependencies]
benchmark = ["psutil>=5.9"]

[project.urls]
Repository = "https://github.com/HenryZ16/skd-backtest"

[tool.setuptools.packages.find]
where = ["src"]
