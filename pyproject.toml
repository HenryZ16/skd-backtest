[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skd-backtest"
version = "0.1.0"
description = "Top-down skeleton for an index-enhancement backtest engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=14"]

[project.urls]
Repository = "https://github.com/HenryZ16/skd-backtest"

[tool.setuptools.packages.find]
where = ["src"]
